<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IEM Photography Competition</title>
<style>
:root{--bg:#070707;--p:#101010;--p2:#151515;--text:#f7f5f2;--muted:#9b9894;--line:#292929;--red:#d8172f;--red2:#ff3b50;--gold:#f0c56e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#d8172f22,transparent 30%),var(--bg);color:var(--text);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.top{height:76px;padding:0 5vw;border-bottom:1px solid #222;display:flex;align-items:center;position:sticky;top:0;z-index:30;background:#070707d9;backdrop-filter:blur(15px)}.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em}.brand img{width:40px;height:40px;object-fit:cover;border-radius:11px}.brand b{color:var(--red2)}nav{display:flex;gap:5px;align-items:center;margin-left:auto}nav button{border:0;background:none;color:#aaa;padding:10px 13px;border-radius:10px}nav button:hover{color:#fff;background:#151515}.solid,.outline{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 18px;border:1px solid transparent;font-weight:700}.solid{background:var(--red);color:white}.solid:hover{background:var(--red2)}.outline{border-color:#3a3a3a;background:transparent;color:#fff}.hero{min-height:calc(100vh - 76px);display:grid;grid-template-columns:1.05fr .95fr;align-items:center;padding:6vw;gap:20px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#d6d1ca;font-weight:700}.hero h1{font-size:clamp(62px,8vw,116px);line-height:.87;letter-spacing:-.07em;margin:22px 0}.hero h1 em{color:var(--red2);font-style:normal}.hero p{color:#aaa;max-width:620px;font-size:18px;line-height:1.65}.actions{display:flex;gap:12px;margin-top:28px}.stats{display:flex;gap:28px;margin-top:40px;color:#888}.stats b{display:block;color:white;font-size:26px}.stage{height:600px;position:relative}.card{position:absolute;width:270px;background:#111;border:1px solid #333;padding:8px;border-radius:20px;box-shadow:0 30px 80px #0008}.card img{width:100%;aspect-ratio:1.25;object-fit:cover;border-radius:14px}.card div{padding:12px 8px}.card small,.card b{display:block}.card small{color:#777;margin-top:5px;font-size:11px}.a{left:5%;top:10%;transform:rotate(-8deg)}.b{right:0;top:25%;transform:rotate(7deg);width:240px}.c{left:27%;bottom:5%;transform:rotate(-2deg);width:225px}.pill{position:absolute;right:0;bottom:22%;background:#ffffff12;border:1px solid #ffffff1a;border-radius:999px;padding:10px 14px}.section{padding:95px 6vw}.head{display:flex;justify-content:space-between;align-items:end;gap:20px}.head h2{font-size:clamp(38px,4vw,62px);letter-spacing:-.05em;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:35px}.tile{min-height:360px;border:1px solid #252525;border-radius:20px;overflow:hidden;position:relative;background:#111}.tile img{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;left:0;right:0;bottom:0;padding:55px 18px 18px;background:linear-gradient(transparent,#000e)}.overlay span,.overlay b,.overlay small{display:block}.overlay span{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#ddd}.overlay b{font-size:23px;margin-top:5px}.overlay small{color:#aaa;margin-top:5px}.dark{background:#101010;border-top:1px solid #222;border-bottom:1px solid #222}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:35px}.step{padding:20px;border:1px solid #292929;border-radius:16px;background:#0c0c0c}.step b{display:block;margin:12px 0 5px}.step p{color:#777;line-height:1.5;margin:0}.page{padding:70px 6vw 100px;max-width:1500px;margin:auto}.page h1{font-size:clamp(44px,6vw,78px);letter-spacing:-.06em;margin:14px 0}.page p{color:#999;line-height:1.6}.tools{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:28px 0;flex-wrap:wrap}.search{background:#0d0d0d;border:1px solid #292929;border-radius:12px;padding:12px 14px;color:#fff;min-width:280px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#0d0d0d;border:1px solid #292929;color:#aaa;border-radius:999px;padding:9px 13px}.chip.active,.chip:hover{background:#fff;color:#000}.auth{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:30px}.authbox{width:min(460px,100%);background:#101010;border:1px solid #292929;border-radius:25px;padding:35px;box-shadow:0 30px 80px #0008}.authbox img{width:55px;height:55px;object-fit:cover;border-radius:14px}.form{display:grid;gap:14px;margin-top:22px}.form label{display:grid;gap:6px;color:#aaa}.form input,.form select,.form textarea{background:#090909;border:1px solid #2b2b2b;color:#fff;border-radius:11px;padding:12px}.form textarea{min-height:100px}.full{width:100%;justify-content:center}.error{background:#351118;border:1px solid #6f1f2a;color:#ffb6be;padding:10px;border-radius:10px;margin:12px 0}.admin{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 76px)}.side{background:#0b0b0b;border-right:1px solid #222;padding:20px 12px;display:flex;flex-direction:column;gap:5px}.side h3{padding:10px;color:#fff}.side button{border:0;background:none;color:#888;text-align:left;padding:12px;border-radius:10px}.side button:hover,.side .sel{background:#181818;color:#fff}.side .bottom{margin-top:auto}.adminmain{padding:40px 4vw}.adminhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.status{padding:9px 13px;border:1px solid #333;border-radius:999px;color:#aaa}.statsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#101010;border:1px solid #292929;border-radius:16px;padding:18px}.stat small{color:#777}.stat strong{display:block;font-size:36px;margin-top:7px}.panel{background:#101010;border:1px solid #292929;border-radius:18px;padding:20px;margin-top:18px}.panel h2{margin-top:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #242424;padding:11px;color:#aaa}.table th{font-size:10px;color:#666;text-transform:uppercase}.thumb{width:45px;height:45px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:8px}.leader{display:grid;grid-template-columns:40px 55px 1fr auto;gap:10px;align-items:center;border:1px solid #292929;background:#0c0c0c;border-radius:12px;padding:9px;margin:7px 0}.leader img{width:55px;height:55px;object-fit:cover;border-radius:8px}.leader small{display:block;color:#777;margin-top:4px}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:20px;z-index:60}.modalbox{width:min(950px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #333;border-radius:22px;padding:12px}.modalbox img{width:100%;max-height:65vh;object-fit:contain;background:#080808;border-radius:15px}.modalinfo{padding:16px}.close{float:right;background:#222;border:0;color:#fff;border-radius:50%;width:34px;height:34px}.toast{position:fixed;right:20px;bottom:20px;background:#fff;color:#000;padding:13px 17px;border-radius:12px;z-index:100;box-shadow:0 20px 50px #0008}footer{border-top:1px solid #222;padding:25px 6vw;color:#777;display:flex;justify-content:space-between} @media(max-width:900px){.hero{grid-template-columns:1fr}.stage{height:500px}.grid{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr}.admin{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto}.two{grid-template-columns:1fr}.statsgrid{grid-template-columns:1fr 1fr}}@media(max-width:650px){nav{display:none}.hero{padding:50px 22px}.hero h1{font-size:62px}.hero p{font-size:16px}.actions{flex-direction:column}.section,.page{padding:60px 22px}.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.stage{height:450px}.card{width:210px}.a{left:0}.b{right:0}.c{left:20%}.statsgrid{grid-template-columns:1fr 1fr}.adminmain{padding:25px 16px}footer{display:block;padding:25px 22px}footer span{display:block;margin-top:10px}}
</style></head><body><div id="app"></div><script>
const KEY='iem_photo_v2';
const demo=[
{id:1,title:'Campus Light',cat:'Campus Life',student:'Aarav S.',email:'student@iem.local',img:'photos/campus.svg',votes:128,desc:'A warm campus moment after the last lecture.'},
{id:2,title:'After Rain',cat:'Nature & Landscape',student:'Riya M.',email:'student@iem.local',img:'photos/nature.svg',votes:112,desc:'A quiet landscape after an afternoon shower.'},
{id:3,title:'Quiet Portrait',cat:'Portraits',student:'Ananya D.',email:'student@iem.local',img:'photos/portrait.svg',votes:97,desc:'A portrait built around natural expression and light.'},
{id:4,title:'Lines & Light',cat:'Architecture',student:'Rahul K.',email:'student@iem.local',img:'photos/architecture.svg',votes:88,desc:'Architecture becomes geometry when the sun moves.'},
{id:5,title:'Pocket Stories',cat:'Mobile Photography',student:'Ishita P.',email:'student@iem.local',img:'photos/mobile.svg',votes:79,desc:'A mobile frame from an ordinary walk.'},
{id:6,title:'Unexpected',cat:'Open Category',student:'Kabir N.',email:'student@iem.local',img:'photos/open.svg',votes:71,desc:'A frame that found its own story.'}
];
const cats=['Campus Life','Nature & Landscape','Portraits','Architecture','Mobile Photography','Open Category'];
const initial={users:[{name:'Demo Student',email:'student@iem.local',password:'ChangeMe123!',role:'student',college:'IEM/UEM'},{name:'IEM Competition Team',email:'organizer@iem.local',password:'ChangeMe123!',role:'organizer',college:'IEM/UEM'}],photos:demo,votes:{},closed:false,categories:[...cats]};
function db(){try{return JSON.parse(localStorage.getItem(KEY))||initial}catch{return initial}} function save(x){localStorage.setItem(KEY,JSON.stringify(x))} if(!localStorage.getItem(KEY))save(initial);
let state=db();let current=null;let route=location.hash||'#home';
function user(){return current||JSON.parse(localStorage.getItem('iem_current')||'null')}function setUser(u){current=u;localStorage.setItem('iem_current',JSON.stringify(u))}function signout(){current=null;localStorage.removeItem('iem_current');go('#home')}
function go(h){route=h;render();window.scrollTo(0,0)}window.addEventListener('hashchange',()=>{route=location.hash;render()});
function nav(){const u=user();return `<header class="top"><a class="brand" href="#home"><img src="iem-logo.jpg">IEM <b>PHOTO</b></a><nav><button onclick="go('#gallery')">Explore</button><button onclick="go('#results')">Leaderboard</button>${u?.role==='student'?'<button onclick="go(\'#mine\')">My Entries</button>':''}${u?.role==='organizer'?'<button onclick="go(\'#admin\')">Organizer</button>':''}${u?`<button onclick="signout()">Sign out</button>`:`<button onclick="go('#login')">Student Login</button><button class="solid" onclick="go('#orglogin')">Organizer</button>`}</nav></header>`}
function home(){return `<main><section class="hero"><div><span class="eyebrow">IEM / UEM · ANNUAL VISUAL STORIES</span><h1>See the<br><em>ordinary</em><br>differently.</h1><p>Submit your best photograph, discover what your campus sees, and vote for the images that stay with you.</p><div class="actions"><a class="solid" href="#gallery">Explore the gallery →</a><a class="outline" href="#login">Enter the competition</a></div><div class="stats"><span><b>${state.closed?'0':'26'}</b> days to close</span><span><b>${state.categories.length}</b> categories</span><span><b>1</b> community</span></div></div><div class="stage"><div class="card a"><img src="photos/campus.svg"><div><b>Campus Light</b><small>Campus Life · 128 votes</small></div></div><div class="card b"><img src="photos/nature.svg"><div><b>After Rain</b><small>Nature · 112 votes</small></div></div><div class="card c"><img src="photos/architecture.svg"><div><b>Lines & Light</b><small>Architecture · 88 votes</small></div></div><div class="pill">● Live voting</div></div></section><section class="section"><div class="head"><div><span class="eyebrow">THE SHOWCASE</span><h2>Frames worth stopping for.</h2></div><a href="#gallery">View all →</a></div><div class="grid">${state.photos.slice(0,6).map(tile).join('')}</div></section><section class="section dark"><span class="eyebrow">HOW IT WORKS</span><h2>From shutter to spotlight.</h2><div class="steps"><div class="step"><small>01</small><b>Submit</b><p>Upload a photograph into the right category.</p></div><div class="step"><small>02</small><b>Discover</b><p>Browse a clean, searchable gallery.</p></div><div class="step"><small>03</small><b>Vote</b><p>Support the frames you genuinely love.</p></div><div class="step"><small>04</small><b>Win</b><p>Winners are published by category.</p></div></div></section></main>`}
function tile(p){return `<article class="tile" onclick="openPhoto(${p.id})"><img src="${p.img}"><div class="overlay"><span>${p.cat}</span><b>${p.title}</b><small>${p.student} · ${p.votes} votes</small></div></article>`}
function gallery(){let q='',c='All';return `<main class="page"><span class="eyebrow">THE GALLERY</span><h1>Explore the competition.</h1><p>Find a frame, read the story, and cast your vote.</p><div class="tools"><input id="search" class="search" placeholder="Search photos or creators" oninput="filterGallery()"><div class="chips"><button class="chip active" onclick="setCat('All')">All</button>${state.categories.map(x=>`<button class="chip" onclick="setCat('${x.replaceAll("'","\\'")}')">${x}</button>`).join('')}</div></div><div id="galleryGrid" class="grid">${state.photos.map(tile).join('')}</div></main>`}
let activeCat='All';function setCat(c){activeCat=c;filterGallery();document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.textContent===c))}function filterGallery(){const q=(document.getElementById('search')?.value||'').toLowerCase();const list=state.photos.filter(p=>(activeCat==='All'||p.cat===activeCat)&&(`${p.title} ${p.student} ${p.cat}`.toLowerCase().includes(q)));document.getElementById('galleryGrid').innerHTML=list.map(tile).join('')||'<div class="panel">No frames match your search.</div>'}
function openPhoto(id){const p=state.photos.find(x=>x.id===id);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="document.getElementById('modal').remove()">×</button><img src="${p.img}"><div class="modalinfo"><span class="eyebrow">${p.cat}</span><h2>${p.title}</h2><p>Captured by <b>${p.student}</b></p><p>${p.desc||''}</p><button class="solid" onclick="vote(${p.id})">♥ Vote · ${p.votes}</button></div></div></div>`) }
function vote(id){const u=user();if(!u||u.role!=='student'){alert('Please sign in as a student to vote.');return}if(state.closed){alert('Voting is closed.');return}state.votes[u.email]??=[];if(state.votes[u.email].includes(id)){alert('You already voted for this photo.');return}state.votes[u.email].push(id);const p=state.photos.find(x=>x.id===id);p.votes++;save(state);document.getElementById('modal')?.remove();toast('Vote recorded — thank you!');render()}
function login(org=false){return `<main class="auth"><div class="authbox"><img src="iem-logo.jpg"><span class="eyebrow">${org?'ORGANIZER CONSOLE':'STUDENT PORTAL'}</span><h1>${org?'Control the competition.':'Your next frame starts here.'}</h1><p>${org?'Manage entries, categories, voting and results.':'Sign in to explore the gallery and vote.'}</p><div id="autherr"></div><form class="form" onsubmit="doLogin(event,${org})">${!org?'<label>Full name (for new account)<input id="name" placeholder="Optional"></label>':''}<label>Email<input id="email" type="email" required></label><label>Password<input id="pass" type="password" required></label><button class="solid full">${org?'Open organizer console':'Sign in'}</button></form>${!org?'<p><small>New student? The first login with a new email will create an account.</small></p>':''}<p><small>Demo: ${org?'organizer@iem.local':'student@iem.local'} / ChangeMe123!</small></p></div></main>`}
function doLogin(e,org){e.preventDefault();state=db();const email=document.getElementById('email').value.toLowerCase();const pass=document.getElementById('pass').value;let u=state.users.find(x=>x.email===email);if(!u&&!org){u={name:document.getElementById('name').value||email.split('@')[0],email,password:pass,role:'student',college:'IEM/UEM'};state.users.push(u);save(state)}if(!u||u.password!==pass||(org&&u.role!=='organizer')||(!org&&u.role!=='student')){document.getElementById('autherr').innerHTML='<div class="error">Email, password, or portal is incorrect.</div>';return}setUser(u);go(org?'#admin':'#gallery')}
function mine(){const u=user();const ps=state.photos.filter(p=>p.email===u?.email);return `<main class="page"><span class="eyebrow">YOUR WORK</span><h1>My entries.</h1><p>Keep track of your submitted frames and their live votes.</p><div class="grid">${ps.length?ps.map(tile).join(''):'<div class="panel">No entries yet. Your organizer can upload entries for the competition.</div>'}</div></main>`}
function admin(){if(user()?.role!=='organizer')return login(true);return `<main class="admin"><aside class="side"><h3>IEM PHOTO<br><small>Organizer Console</small></h3><button class="sel" onclick="adminTab('dashboard')">Dashboard</button><button onclick="adminTab('submissions')">Submissions</button><button onclick="adminTab('categories')">Categories</button><button onclick="adminTab('results')">Results</button><div class="bottom"><button onclick="signout()">Sign out</button></div></aside><section class="adminmain" id="admincontent"></section></main>`}
function adminTab(tab){const el=document.getElementById('admincontent');document.querySelectorAll('.side button').forEach(x=>x.classList.remove('sel'));const btn=[...document.querySelectorAll('.side button')].find(x=>x.textContent.toLowerCase().includes(tab));btn?.classList.add('sel');if(tab==='dashboard')el.innerHTML=dashboard();if(tab==='submissions')el.innerHTML=submissions();if(tab==='categories')el.innerHTML=categories();if(tab==='results')el.innerHTML=results();}
function dashboard(){const votes=state.photos.reduce((a,p)=>a+p.votes,0);return `<div class="adminhead"><div><span class="eyebrow">ORGANIZER CONSOLE</span><h1>Competition control</h1></div><span class="status">${state.closed?'closed':'live'}</span></div><div class="statsgrid"><div class="stat"><small>Entries</small><strong>${state.photos.length}</strong></div><div class="stat"><small>Votes</small><strong>${votes}</strong></div><div class="stat"><small>Students</small><strong>${state.users.filter(x=>x.role==='student').length}</strong></div><div class="stat"><small>Categories</small><strong>${state.categories.length}</strong></div></div><div class="two"><div class="panel"><span class="eyebrow">LIVE CONTROL</span><h2>Voting status</h2><p>Voting is currently <b>${state.closed?'closed':'live'}</b>.</p><button class="solid" onclick="toggleClosed()">${state.closed?'Reopen voting':'Close voting'}</button></div><div class="panel"><span class="eyebrow">WORKFLOW</span><h2>Judge-ready controls</h2><p>Entries → categories → voting → close → leaderboard. Duplicate votes are blocked per student and photo.</p></div></div>`}
function submissions(){return `<div class="adminhead"><div><span class="eyebrow">CURATION</span><h1>Submissions</h1></div></div><div class="panel"><h2>Add a submission</h2><form class="form" onsubmit="addSubmission(event)"><label>Title<input id="ptitle" required></label><label>Student email<select id="pstudent">${state.users.filter(x=>x.role==='student').map(x=>`<option value="${x.email}">${x.name} · ${x.email}</option>`).join('')}</select></label><label>Category<select id="pcat">${state.categories.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Image<input id="pfile" type="file" accept="image/*" required></label><label>Description<textarea id="pdesc"></textarea></label><button class="solid">Publish submission</button></form></div><div class="panel"><h2>All submissions</h2><table class="table"><tr><th>Frame</th><th>Student</th><th>Category</th><th>Votes</th></tr>${state.photos.map(p=>`<tr><td><img class="thumb" src="${p.img}">${p.title}</td><td>${p.student}</td><td>${p.cat}</td><td>${p.votes}</td></tr>`).join('')}</table></div>`}
function addSubmission(e){e.preventDefault();const f=document.getElementById('pfile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const email=document.getElementById('pstudent').value;const u=state.users.find(x=>x.email===email);state.photos.push({id:Date.now(),title:document.getElementById('ptitle').value,cat:document.getElementById('pcat').value,student:u?.name||email,email,img:r.result,votes:0,desc:document.getElementById('pdesc').value});save(state);adminTab('submissions');toast('Submission published.')};r.readAsDataURL(f)}
function categories(){return `<div class="adminhead"><div><span class="eyebrow">STRUCTURE</span><h1>Categories</h1></div></div><div class="panel"><form class="form" onsubmit="addCat(event)"><label>New category<input id="newcat" required></label><button class="solid">Add category</button></form></div><div class="grid">${state.categories.map(c=>`<div class="panel"><b>${c}</b><p>Active competition category.</p></div>`).join('')}</div>`}
function addCat(e){e.preventDefault();const c=document.getElementById('newcat').value.trim();if(c&&!state.categories.includes(c)){state.categories.push(c);save(state);adminTab('categories')}else alert('Category already exists.')}
function results(){const sorted=[...state.photos].sort((a,b)=>b.votes-a.votes);return `<div class="adminhead"><div><span class="eyebrow">FINAL TALLY</span><h1>Leaderboard</h1></div></div><div class="panel">${sorted.map((p,i)=>`<div class="leader"><strong>#${i+1}</strong><img src="${p.img}"><div><b>${p.title}</b><small>${p.student} · ${p.cat}</small></div><span>${p.votes} votes</span></div>`).join('')}</div>`}
function publicResults(){const sorted=[...state.photos].sort((a,b)=>b.votes-a.votes);return `<main class="page"><span class="eyebrow">THE RESULTS</span><h1>Community leaderboard.</h1><p>Live votes and the frames leading the room.</p><div class="grid">${sorted.slice(0,3).map(tile).join('')}</div><div class="panel" style="margin-top:25px">${sorted.map((p,i)=>`<div class="leader"><strong>#${i+1}</strong><img src="${p.img}"><div><b>${p.title}</b><small>${p.student} · ${p.cat}</small></div><span>${p.votes} votes</span></div>`).join('')}</div></main>`}
function toggleClosed(){state.closed=!state.closed;save(state);adminTab('dashboard');toast(state.closed?'Voting closed.':'Voting reopened.')}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function render(){state=db();const base=nav();let content='';if(route==='#home')content=home();else if(route==='#gallery')content=gallery();else if(route==='#login')content=login(false);else if(route==='#orglogin')content=login(true);else if(route==='#mine')content=mine();else if(route==='#admin')content=admin();else if(route==='#results')content=publicResults();else content=home();document.getElementById('app').innerHTML=base+content+`<footer><b>IEM Photography Competition</b><span>Capture · Express · Inspire · 2026</span></footer>`;if(route==='#admin'&&user()?.role==='organizer')adminTab('dashboard')}
render();
</script></body></html>
